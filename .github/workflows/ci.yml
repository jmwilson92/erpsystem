name: CI

on:
  push:
    branches: [main, beta, "release/**"]
  pull_request:
    branches: [main, beta]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gate: nothing here touches a database, so a failure is always a real
  # code problem. Kept separate from `verify` so a database hiccup can never
  # make a type error look like infrastructure noise, or vice versa.
  check:
    name: Typecheck & lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Production env assert (script dry-run)
        run: node scripts/assert-production-env.mjs --dry-run

      - name: Unit smoke (auth + modules)
        run: npx tsx scripts/smoke-unit.ts

      # Builds with AIRGAP=1 and greps the client bundle for third-party hosts.
      # Guards the on-premise claim: an import that reintroduces egress fails
      # here instead of shipping inside an ITAR/CUI image. This caught a real
      # miss already — gating <Analytics /> in JSX still bundled its collector
      # URL, because a conditional render does not drop the dependency.
      - name: Air-gapped build ships no third-party hosts
        run: npm run verify:airgap

      - name: Tenant DDL is in sync with the schema
        # src/lib/tenant-template.ts is generated. When it lags schema.prisma,
        # every newly provisioned tenant and demo is born missing tables — which
        # has bitten this repo. Regenerate and fail if the committed file moves.
        run: |
          node scripts/gen-tenant-ddl.mjs
          if ! git diff --quiet -- src/lib/tenant-template.ts; then
            echo "::error::src/lib/tenant-template.ts is stale. Run: node scripts/gen-tenant-ddl.mjs"
            git diff --stat -- src/lib/tenant-template.ts
            exit 1
          fi

  # Everything that needs a real database. Gets its own throwaway Postgres, so
  # these checks actually run instead of all failing on ECONNREFUSED.
  verify:
    name: Service verification
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: forgerp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forge -d forgerp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # The verify scripts read process.env directly and never load .env, so
      # both are set here explicitly. This is why every chunk used to fail.
      DATABASE_URL: postgresql://forge:forge@localhost:5432/forgerp_ci?schema=public
      DIRECT_URL: postgresql://forge:forge@localhost:5432/forgerp_ci?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Push schema
        run: npx prisma db push --accept-data-loss

      - name: Seed
        run: npm run db:seed

      - name: Audit log is append-only (800-171 3.3.8)
        # Applies the triggers, then proves they actually refuse UPDATE and
        # DELETE while still allowing INSERT — audit logging must keep working.
        #
        # psql rejects Prisma's `?schema=` query parameter, so the URL is
        # stripped first. And the negative tests match the trigger's own error
        # text rather than just "did psql fail": inside `if ...; then`, a psql
        # that failed for ANY other reason would make the condition false and
        # let the test pass while proving nothing.
        run: |
          set -euo pipefail
          PSQL_URL="${DATABASE_URL%%\?*}"
          psql "$PSQL_URL" -c 'SELECT 1' >/dev/null

          npx tsx scripts/apply-audit-hardening.ts
          npx tsx scripts/apply-audit-hardening.ts --check

          # Unique per run: a hardcoded id makes a re-run of this job against the
          # same database fail on a duplicate key, which looks like a broken
          # audit log rather than a repeated test.
          ID="ci-immutable-$(date +%s%N)"
          psql "$PSQL_URL" -c "INSERT INTO public.\"AuditLog\" (id,\"entityType\",\"entityId\",action) VALUES ('$ID','Part','p','CREATE');"

          for op in \
            "UPDATE public.\"AuditLog\" SET action='X' WHERE id='$ID';" \
            "DELETE FROM public.\"AuditLog\" WHERE id='$ID';" \
            "DELETE FROM public.\"AuditLog\" WHERE id='no-such-row';"
          do
            if out=$(psql "$PSQL_URL" -v ON_ERROR_STOP=1 -c "$op" 2>&1); then
              echo "FAIL: AuditLog accepted: $op"; exit 1
            fi
            if ! printf '%s' "$out" | grep -q 'append-only'; then
              echo "FAIL: refused for the wrong reason: $out"; exit 1
            fi
          done

          rows=$(psql "$PSQL_URL" -tAc "SELECT count(*) FROM public.\"AuditLog\" WHERE id='$ID';")
          [ "$rows" = "1" ] || { echo "FAIL: the audit row did not survive"; exit 1; }
          echo "AuditLog refuses UPDATE and DELETE, accepts INSERT, row intact"

      - name: Service verification chunks (A–I, serials, RMA)
        run: npm run verify:svc
