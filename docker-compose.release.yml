# Protessera on-premise stack — runs from a published image.
#
# This is the file a CUSTOMER gets. It is deliberately standalone rather than an
# overlay on docker-compose.yml: that file carries `build: .`, which needs the
# source tree, and a customer who has only downloaded an installer has no source
# to build from. An overlay would fail at the least convenient moment.
#
#   scripts/install.sh   generates .env and starts this
#   or by hand:
#     docker compose -f docker-compose.release.yml up -d
#
# Everything stays on this machine. Postgres runs beside the app and its data
# lives in the protessera_pgdata volume; nothing is sent anywhere.
services:
  app:
    # IMAGE_TAG picks the variant. Use a -airgap tag for an ITAR/CUI site: that
    # is a different BUILD, not a runtime switch, because the analytics package
    # is aliased away at build time.
    image: ${PROTESSERA_IMAGE:-ghcr.io/jmwilson92/erpsystem}:${IMAGE_TAG:-latest}
    container_name: protessera
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://protessera:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/protessera?schema=public"
      DIRECT_URL: "postgresql://protessera:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/protessera?schema=public"

      # Login required, no persona switcher. This is a real deployment.
      DEMO_MODE: "0"
      ALLOW_DEMO_IN_PRODUCTION: "0"
      # Config essentials only — chart of accounts, UOMs, permissions. No demo
      # content. The first visit claims the instance and creates the admin.
      SEED_ON_FIRST_BOOT: "prod"

      # Required. Second-factor secrets are encrypted with a key derived from
      # this; losing or changing it locks out everyone already enrolled, with no
      # recovery path. The installer generates it once and never rewrites it.
      MFA_SECRET_KEY: ${MFA_SECRET_KEY:?MFA_SECRET_KEY is required}

      NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:3000}
      APP_URL: ${APP_URL:-http://localhost:3000}

      # On-premise posture. AIRGAP=1 additionally refuses to start if any
      # outbound integration key is set, rather than starting and leaking.
      AIRGAP: ${AIRGAP:-0}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-}

      # Optional outbound integrations. Leave blank for an isolated site; they
      # are refused outright when AIRGAP=1.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    ports:
      - "${HTTP_PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  postgres:
    image: postgres:16-alpine
    container_name: protessera-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: protessera
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: protessera
    # Deliberately NOT published to the host. The app reaches Postgres over the
    # compose network; exposing 5432 would put the database on the LAN for no
    # benefit. Use `docker compose exec postgres psql` for a shell.
    volumes:
      - protessera_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U protessera -d protessera"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  protessera_pgdata:
